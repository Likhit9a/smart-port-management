name: E2E tests (production)

on:
  schedule:
    # Nightly at 03:30 UTC (~9:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: {}

jobs:
  e2e:
    name: Playwright suite against production
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: e2e

    steps:
      # Checkout FIRST so that the e2e/ directory exists
      - uses: actions/checkout@v4

      # Check whether the E2E password has been configured
      - name: Check E2E secret is configured
        id: check
        run: |
          if [ -n "${{ secrets.E2E_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E_PASSWORD not set -- skipping this run. Add it under Settings > Secrets and variables > Actions to enable this job."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.check.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        if: steps.check.outputs.configured == 'true'
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      - name: Upload HTML report
        if: always() && steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report/
          retention-days: 14
